# Runs the full testthat suite + covr on every push/PR and fails the build if
# tests fail. This is what actually enforces "future updates don't break
# everything" — it doesn't rely on any agent or human remembering to run tests
# locally. Pair with branch protection rules requiring this check to pass
# before merge to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::testthat
          needs: coverage

      - name: Run testthat suite
        run: |
          Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
        shell: bash

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          covr::to_cobertura(cov)
          print(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          file: ./cobertura.xml
          fail_ci_if_error: false

      - name: Show testthat output on failure
        if: failure()
        run: |
          find . -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
